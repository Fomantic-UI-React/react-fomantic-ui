name: CI

on:
  push:
    branches: [main]
  # No branch filter: the Phase 2 ports are a stacked sequence, and a PR based
  # on another PR's branch got no checks at all while this was limited to main.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: TypeScript definitions
        run: yarn tsd:test

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build:dist

      # Guards the handledProps invariant: getUnhandledProps reads a static
      # array on each component to decide which props are its own API. If
      # those go missing, every declared prop silently leaks onto the DOM.
      - name: Verify built output
        run: node scripts/verify-build.js

      # 162 story files are generated from the examples, so nothing else
      # notices when one stops compiling. This is also the build Chromatic
      # will take its snapshots from.
      - name: Build Storybook
        run: yarn build-storybook --quiet

  # Visual regression. Separate from `build` so a snapshot diff — which needs a
  # human to accept or reject — does not read as the test suite failing.
  chromatic:
    runs-on: ubuntu-latest

    # GitHub does not pass repository secrets to `pull_request` runs from a
    # fork, deliberately: a PR can change the workflow, so a fork with secrets
    # could exfiltrate them. Chromatic then fails with "Missing project token",
    # which looks like a broken contribution rather than a policy.
    #
    # So it is skipped for fork PRs and runs on the push to `main` instead. The
    # diff still gets caught, one step later than for a branch on this repo.
    # See "Phase 3" in PLAN.md for the alternative and why it is not taken yet.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # TurboSnap decides what to re-snapshot by diffing against the
          # baseline's commit, which a shallow clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Only snapshot stories whose code actually changed. A CSS bump
          # touches everything and costs a full build; a component change costs
          # a fraction of one. See "Phase 3" in PLAN.md for the budget.
          onlyChanged: true
          # A visual diff is a question for a reviewer, not a broken build.
          exitZeroOnChanges: true
